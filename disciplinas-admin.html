<!DOCTYPE html>
<html lang="es" data-tema="oscuro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Disciplinas — Administración DAIA</title>
  <link rel="stylesheet" href="estilos.css">
  <link rel="stylesheet" href="estilos-v4.css">
  <link rel="stylesheet" href="admin-panel.css">
  <link rel="stylesheet" href="admin-dialogos.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    (function () {
      try {
        var pedido = new URLSearchParams(location.search).get('tema');
        var tema = pedido || localStorage.getItem('daia-tema') || 'oscuro';
        document.documentElement.setAttribute('data-tema', tema);
      } catch (e) { /* sin almacenamiento */ }
    })();
  </script>
</head>
<body>

  <div class="fondo-foto"></div>
  <div class="fondo-velo"></div>

  <header class="cabecera">
    <div class="ancho">
      <a class="marca" href="admin.html">
        <img src="daia.png" id="logo-daia" alt="DAIA">
        <img src="ucv.png" id="logo-ucv" alt="Universidad Central de Venezuela">
        <span class="marca-texto">
          <strong>Administración · Disciplinas</strong>
          <span>Dirección de Atención Integral al Atleta</span>
        </span>
      </a>
      <div class="cabecera-acciones">
        <a class="enlace-suave" href="admin.html">Volver al panel</a>
        <button class="boton-tema" id="boton-tema" aria-label="Cambiar tema">☾</button>
      </div>
    </div>
  </header>

  <main>
    <div class="ancho panel">

      <div class="barra-panel">
        <h1>Disciplinas</h1>
        <span class="contador" id="contador-disciplinas">Cargando…</span>
      </div>

      <section class="alta">
        <div class="grupo-campo">
          <label class="etiqueta-sm" for="input-nueva-disciplina">Nueva disciplina</label>
          <input class="campo" id="input-nueva-disciplina" type="text" placeholder="Ej: RUGBY">
        </div>
        <button class="boton" id="btn-agregar-disciplina" type="button">Agregar</button>
      </section>

      <div class="tabla-envoltura">
        <table class="tabla">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Clave</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-disciplinas-body"></tbody>
        </table>
      </div>

    </div>
  </main>

  <footer class="pie">
    <div class="ancho">
      <span>Universidad Central de Venezuela · Dirección de Deportes</span>
      <span>daiadd@gmail.com · +58 212 605-4619</span>
    </div>
  </footer>

  <div class="toast-zona" id="toast-zona" aria-live="polite"></div>

  <script src="admin-common.js"></script>
  <script src="disciplinas-admin.js"></script>
</body>
</html>
