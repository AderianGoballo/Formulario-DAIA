<!DOCTYPE html>
<html lang="es" data-tema="oscuro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atletas — Administración DAIA</title>
  <link rel="stylesheet" href="estilos.css">
  <link rel="stylesheet" href="estilos-v4.css">
  <link rel="stylesheet" href="admin-panel.css">
  <link rel="stylesheet" href="admin-dialogos.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    (function () {
      try {
        var pedido = new URLSearchParams(location.search).get('tema');
        var tema = pedido || localStorage.getItem('daia-tema') || 'oscuro';
        document.documentElement.setAttribute('data-tema', tema);
      } catch (e) { /* sin almacenamiento */ }
    })();
  </script>
</head>
<body>

  <div class="fondo-foto"></div>
  <div class="fondo-velo"></div>

  <header class="cabecera">
    <div class="ancho">
      <a class="marca" href="admin.html">
        <img src="daia.png" id="logo-daia" alt="DAIA">
        <img src="ucv.png" id="logo-ucv" alt="Universidad Central de Venezuela">
        <span class="marca-texto">
          <strong>Administración · Atletas</strong>
          <span>Dirección de Atención Integral al Atleta</span>
        </span>
      </a>
      <div class="cabecera-acciones">
        <a class="enlace-suave" href="admin.html">Volver al panel</a>
        <button class="boton-tema" id="boton-tema" aria-label="Cambiar tema">☾</button>
      </div>
    </div>
  </header>

  <main>
    <div class="ancho panel">

      <div class="barra-panel">
        <h1>Atletas</h1>
        <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
          <input class="campo" id="filtro-atletas" type="search" placeholder="Buscar por nombre o cédula" style="height: 44px; min-width: 240px; padding-left: 14px;">
          <span class="contador" id="contador-atletas">Cargando…</span>
        </div>
      </div>

      <section class="alta">
        <div class="grupo-campo">
          <label class="etiqueta-sm" for="input-nuevo-atleta">Nombre completo</label>
          <input class="campo" id="input-nuevo-atleta" type="text" placeholder="Nombre y apellido">
        </div>

        <div class="grupo-campo">
          <label class="etiqueta-sm" for="select-disciplina-atleta">Disciplina</label>
          <select class="campo-selector" id="select-disciplina-atleta"></select>
        </div>

        <div class="grupo-campo">
          <label class="etiqueta-sm" for="select-facultad-atleta">Facultad</label>
          <select class="campo-selector" id="select-facultad-atleta"></select>
        </div>

        <div class="grupo-campo">
          <label class="etiqueta-sm" for="select-escuela-atleta">Escuela</label>
          <select class="campo-selector" id="select-escuela-atleta"></select>
        </div>

        <div class="grupo-campo">
          <label class="etiqueta-sm" for="input-cedula-atleta">Cédula</label>
          <input class="campo" id="input-cedula-atleta" type="text" placeholder="31925673">
        </div>

        <div class="grupo-campo">
          <label class="etiqueta-sm" for="input-anio-atleta">Año de ingreso</label>
          <input class="campo" id="input-anio-atleta" type="number" placeholder="2025" min="1990" max="2100">
        </div>

        <div class="grupo-campo">
          <label class="etiqueta-sm" for="input-carrera-atleta">Carrera</label>
          <input class="campo" id="input-carrera-atleta" type="text" placeholder="Comunicación Social">
        </div>

        <button class="boton" id="btn-agregar-atleta" type="button">Agregar atleta</button>
      </section>

      <div class="tabla-envoltura">
        <table class="tabla">
          <thead>
            <tr>
              <th data-orden="id">ID</th>
              <th data-orden="nombre">Nombre</th>
              <th data-orden="cedula">Cédula</th>
              <th data-orden="disciplina">Disciplina</th>
              <th>Facultad</th>
              <th>Escuela</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-atletas-body"></tbody>
        </table>
      </div>

      <div class="paginacion">
        <button class="boton secundario" id="pagina-anterior" type="button">← Anterior</button>
        <span class="info" id="pagina-info">Página 1</span>
        <button class="boton secundario" id="pagina-siguiente" type="button">Siguiente →</button>
      </div>

    </div>
  </main>

  <footer class="pie">
    <div class="ancho">
      <span>Universidad Central de Venezuela · Dirección de Deportes</span>
      <span>daiadd@gmail.com · +58 212 605-4619</span>
    </div>
  </footer>

  <div class="toast-zona" id="toast-zona" aria-live="polite"></div>

  <script src="admin-common.js"></script>
  <script src="atletas-admin.js"></script>
</body>
</html>
