<!DOCTYPE html>
<html lang="es" data-tema="oscuro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Configuración — Administración DAIA</title>
  <link rel="stylesheet" href="estilos.css">
  <link rel="stylesheet" href="estilos-v4.css">
  <link rel="stylesheet" href="admin-panel.css">
  <script>
    (function () {
      try {
        var pedido = new URLSearchParams(location.search).get('tema');
        var tema = pedido || localStorage.getItem('daia-tema') || 'oscuro';
        document.documentElement.setAttribute('data-tema', tema);
      } catch (e) { /* sin almacenamiento */ }
    })();
  </script>
</head>
<body>

  <div class="fondo-foto"></div>
  <div class="fondo-velo"></div>

  <header class="cabecera">
    <div class="ancho">
      <a class="marca" href="admin.html">
        <img src="daia.png" id="logo-daia" alt="DAIA">
        <img src="ucv.png" id="logo-ucv" alt="Universidad Central de Venezuela">
        <span class="marca-texto">
          <strong>Administración · Configuración</strong>
          <span>Dirección de Atención Integral al Atleta</span>
        </span>
      </a>
      <div class="cabecera-acciones">
        <a class="enlace-suave" href="admin.html">Volver al panel</a>
        <button class="boton-tema" id="boton-tema" aria-label="Cambiar tema">☾</button>
      </div>
    </div>
  </header>

  <main>
    <div class="ancho panel">

      <div class="barra-panel">
        <h1>Cambiar la clave de administrador</h1>
      </div>

      <div class="tarjeta-form">
        <label class="etiqueta" for="clave-actual">Clave actual</label>
        <input class="campo-texto" id="clave-actual" type="password" autocomplete="off">

        <label class="etiqueta" for="nueva-clave">Nueva clave</label>
        <input class="campo-texto" id="nueva-clave" type="password" autocomplete="off">

        <label class="etiqueta" for="confirmar-clave">Confirmar nueva clave</label>
        <input class="campo-texto" id="confirmar-clave" type="password" autocomplete="off">

        <button class="boton" id="btn-cambiar-clave" type="button" style="width: 100%;">Cambiar clave</button>

        <span class="ayuda">Mínimo 6 caracteres. La sesión de esta pestaña seguirá activa con la clave nueva.</span>
      </div>

    </div>
  </main>

  <footer class="pie">
    <div class="ancho">
      <span>Universidad Central de Venezuela · Dirección de Deportes</span>
      <span>daiadd@gmail.com · +58 212 605-4619</span>
    </div>
  </footer>

  <div class="toast-zona" id="toast-zona" aria-live="polite"></div>

  <script src="admin-common.js"></script>
  <script src="config-admin.js"></script>
</body>
</html>
